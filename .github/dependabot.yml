version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      # Spring Boot parent / Spring Cloud release train
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - minor
          - patch
      # Spring Cloud GCP BOM and Google client libraries
      google-cloud:
        patterns:
          - "com.google.cloud*"
          - "com.google.firebase*"
        update-types:
          - minor
          - patch
      # Build plugins
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "*maven-plugin"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
