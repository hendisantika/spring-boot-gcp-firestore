spring.application.name=spring-boot-gcp-firestore
# Tests run without real GCP credentials: use the Firestore emulator settings (no connection is made on startup)
spring.cloud.gcp.project-id=test-project
spring.cloud.gcp.firestore.project-id=test-project
spring.cloud.gcp.firestore.emulator.enabled=true
spring.cloud.gcp.firestore.host-port=localhost:8080
